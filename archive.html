<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'">
    <meta name="description" content="Global Macro Signal Report 歷史歸檔">
    <title>歷史歸檔 · Global Macro Signal Report</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/app.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Global Macro Signal Report 首頁">
        <span class="brand-mark" aria-hidden="true">GM</span>
        <span>Global Macro Signal Report</span>
      </a>
      <nav aria-label="主要導覽">
        <a href="index.html">最新報告</a>
        <a aria-current="page" href="archive.html">歷史歸檔</a>
      </nav>
    </header>

    <main class="page-main">
      <section class="page-intro" aria-labelledby="archive-title">
        <p class="eyebrow">Archive</p>
        <h1 id="archive-title">歷史報告</h1>
        <p>依報告類型或日期縮小範圍。所有內容直接讀取 GitHub Pages 內的靜態 HTML mirror。</p>
      </section>

      <section class="archive-panel" aria-label="報告篩選與結果">
        <form id="archive-filters" class="filters">
          <label>
            報告類型
            <select id="category-filter" name="category">
              <option value="all">全部類型</option>
              <option value="early-warning">Early Warning</option>
              <option value="morning">Morning</option>
              <option value="weekly">Weekly</option>
            </select>
          </label>
          <label>
            報告日期
            <input id="date-filter" name="date" type="date">
          </label>
          <button class="button button-secondary" type="reset">清除篩選</button>
        </form>
        <div class="archive-summary">
          <p id="archive-status" class="status" role="status">正在載入索引…</p>
        </div>
        <div id="archive-list" class="archive-list" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p>資料索引：<code>data/reports.json</code></p>
    </footer>

    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/archive.js" defer></script>
  </body>
</html>
